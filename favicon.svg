<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9E7612"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#111111" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="30" y="30" width="452" height="452" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  
  <!-- Stylized Monogram IA -->
  <!-- 'I' Letter -->
  <g fill="#FFFFFF">
    <rect x="130" y="130" width="40" height="252"/>
    <!-- Top Serif -->
    <rect x="110" y="130" width="80" height="20" rx="2"/>
    <!-- Bottom Serif -->
    <rect x="110" y="362" width="80" height="20" rx="2"/>
  </g>
  
  <!-- 'A' Letter -->
  <g>
    <!-- Left Leg (Gold) -->
    <polygon points="260,382 295,382 360,130 325,130" fill="url(#goldGrad)"/>
    <!-- Right Leg (White) -->
    <polygon points="325,130 360,130 425,382 390,382" fill="#FFFFFF"/>
    <!-- Crossbar (Gold) -->
    <rect x="282" y="295" width="120" height="22" rx="2" fill="url(#goldGrad)"/>
    <!-- Apex Crown Tip -->
    <polygon points="325,130 360,130 342.5,100" fill="url(#goldGrad)"/>
  </g>
</svg>
